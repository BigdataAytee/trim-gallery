# Version catalog — every entry must correspond to a line in STACK.md.
#
# Adding a dependency that is not in STACK.md is not allowed without asking first
# and recording the reason in PROJECT.md.
#
# VERIFICATION STATUS
#   [central]  Version resolved against repo1.maven.org while authoring. Trustworthy.
#   [google]   Hosted only on Google Maven (dl.google.com), which was unreachable
#              from the authoring environment (egress policy 403). The version is a
#              best-known-good guess and MUST be confirmed before the first build.
#              Run `tools/verify-versions.sh` from an environment that can reach
#              Google Maven; it prints the latest stable for every [google] entry.

[versions]
# --- Build tooling ---
agp = "8.13.0"                    # [google] com.android.tools.build:gradle
kotlin = "2.3.21"                 # [central] latest stable that KSP 2.3.11 pairs with
ksp = "2.3.11"                    # [central]
detekt = "1.23.8"                 # [central]
ktlint-gradle = "14.2.0"          # [central] plugins.gradle.org

# --- SDK levels (BUILD.md: minSdk 29) ---
compileSdk = "36"                 # [google]
minSdk = "29"
targetSdk = "36"                  # [google]

# --- AndroidX / Compose ---
composeBom = "2026.01.00"         # [google] androidx.compose:compose-bom
activityCompose = "1.11.0"        # [google]
lifecycle = "2.9.4"               # [google]
navigationCompose = "2.9.5"       # [google]
media3 = "1.9.0"                  # [google] androidx.media3:*
work = "2.10.5"                   # [google]
room = "2.8.2"                    # [google]
datastore = "1.1.7"               # [google]
exifinterface = "1.4.1"           # [google]
documentfile = "1.1.0"            # [google]
benchmark = "1.4.1"               # [google]

# --- Third party (STACK.md) ---
coroutines = "1.11.0"             # [central]
hilt = "2.60.1"                   # [central]
coil = "3.6.0"                    # [central]
telephoto = "0.19.0"              # [central]
lottie = "6.7.1"                  # [central]
accompanist = "0.37.3"            # [google]
mlkit-imageLabeling = "17.0.9"    # [google]
mlkit-faceDetection = "16.1.7"    # [google]
mlkit-textRecognition = "16.0.1"  # [google]
litert = "1.4.0"                  # [google]
litr = "1.5.7"                    # [central]
simpleStorage = "3.0.1"           # [central]
isoparser = "1.9.56"              # [central]
jimagehash = "1.0.0"              # [central]

# --- Test ---
junit = "4.13.2"                  # [central]
turbine = "1.2.1"                 # [central]
androidxTestJunit = "1.3.0"       # [google]
espresso = "3.7.0"                # [google]

[libraries]
# Compose (STACK.md "Front end")
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Encoding pipeline (STACK.md "Encoding pipeline")
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-muxer = { group = "androidx.media3", name = "media3-muxer", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Concurrency
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Storage / metadata
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
