# Version catalog — every entry must correspond to a line in STACK.md.
#
# Adding a dependency that is not in STACK.md is not allowed without asking first
# and recording the reason in PROJECT.md.
#
# VERIFICATION STATUS
#   [central]  The exact coordinate below was fetched from repo1.maven.org (or
#              plugins.gradle.org) and returned 200. Verified 30 Aug 2026.
#   [google]   Hosted only on Google Maven (dl.google.com), which this environment's
#              egress policy refuses (403 at the gateway, confirmed — not a tooling
#              fault). The version is a best-known-good guess and MUST be confirmed
#              before the first build.
#
# `tools/verify-versions.sh` checks every entry in this file: it resolves the latest
# stable and confirms the pinned coordinate exists. It reads the catalog rather than
# a hand-maintained list, so it cannot drift out of step with it.

[versions]
# --- Build tooling ---
composeMultiplatform = "1.12.0"   # [central] JetBrains: "the latest Compose Multiplatform is
                                  # always compatible with the latest version of Kotlin", and the
                                  # Compose compiler plugin ships with Kotlin, so these two are
                                  # deliberately not pinned to each other.
                                  #
                                  # 1.12.0 maps to androidx.compose 1.12.0, which declares
                                  # minAgpVersion 9.1.0 and minCompileSdk 37 in its AAR metadata.
                                  # That is why this line could not move alone, and why agp,
                                  # compileSdk, targetSdk, the Gradle wrapper, coil and the two
                                  # lifecycle lines below all move in this same commit. Splitting
                                  # them would just fail `checkDebugAarMetadata` one dependency at a
                                  # time.
agp = "9.1.0"                     # [google] com.android.tools.build:gradle. The floor set by
                                  # androidx.compose 1.12.0's minAgpVersion, read out of the
                                  # published AAR metadata rather than from release notes.
kotlin = "2.4.10"                 # [central] latest stable; Compose Multiplatform tracks latest Kotlin
detekt = "1.23.8"                 # [central]
ktlint-gradle = "14.2.0"          # [central] plugins.gradle.org

# --- SDK levels (BUILD.md: minSdk 29) ---
compileSdk = "37"                 # [google] androidx.compose 1.12.0 and coil3 3.6.0 both
                                  # declare minCompileSdk=37.
minSdk = "29"
targetSdk = "37"                  # [google] moved with compileSdk; behaviour changes for 37
                                  # are reviewed as CI surfaces them.

# --- AndroidX / Compose ---
activityCompose = "1.11.0"        # [google]
lifecycle = "2.10.0"              # [google] matches what lifecycleMp 2.10.0 resolves to on
                                  # Android, so the two lines agree rather than one silently
                                  # upgrading the other.
media3 = "1.9.0"                  # [google] androidx.media3:*
work = "2.10.5"                   # [google]
datastore = "1.1.7"               # [google]
exifinterface = "1.4.1"           # [google]
documentfile = "1.1.0"            # [google]
heifwriter = "1.1.0-alpha03"      # [google]
benchmark = "1.4.1"               # [google]
uiautomator = "2.3.0"             # [google]

# --- KMP (ARCHITECTURE.md; additions to STACK.md recorded in PROJECT.md) ---
sqldelight = "2.3.2"              # [central] replaces Room: Room KMP has no Kotlin/Native iOS target
koin = "4.2.2"                    # [central] replaces Hilt: Hilt is JVM/Android only, no Kotlin/Native
kotlinx-datetime = "0.8.0"        # [central]
kotlinx-serialization = "1.11.0"  # [central]
lifecycleMp = "2.10.0"            # [central] org.jetbrains.androidx.lifecycle. Its release
                                  # variant depends on androidx.lifecycle:lifecycle-viewmodel-compose
                                  # 2.10.0 (read from the Gradle module metadata on Maven Central),
                                  # which is the `lifecycle` line above — the two agree deliberately.
                                  #
                                  # This is the line that made the upgrade unavoidable rather than
                                  # optional: 2.10.0 pulls the androidx.compose line to 1.12.0 from
                                  # behind Compose Multiplatform's back, so holding Compose down
                                  # without holding this down achieved nothing.
navigationMp = "2.9.2"            # [central] org.jetbrains.androidx.navigation

# --- Third party (STACK.md) ---
coroutines = "1.11.0"             # [central]
coil = "3.6.0"                    # [central] Held at 3.5.0 while this build compiled against
                                  # SDK 36, because every coil3 Android artifact at 3.6.0 declares
                                  # minCompileSdk=37 (read out of the published .aar). compileSdk is
                                  # 37 now, so the hold is spent.
telephoto = "0.19.0"              # [central]
lottie = "6.7.1"                  # [central]
accompanist = "0.37.3"            # [google]
mlkit-imageLabeling = "17.0.9"    # [google]
mlkit-faceDetection = "16.1.7"    # [google]
mlkit-textRecognition = "16.0.1"  # [google]
litert = "1.4.0"                  # [google]
litr = "1.5.7"                    # [central]
simpleStorage = "3.0.1"           # [central]
isoparser = "1.9.56"              # [central]
jimagehash = "1.0.0"              # [central]

# --- Test ---
junit = "4.13.2"                  # [central]
turbine = "1.2.1"                 # [central]
androidxTestJunit = "1.3.0"       # [google]
androidxTestRunner = "1.7.0"      # [google] The AndroidJUnitRunner class `testInstrumentationRunner`
                                  # already names. `androidx.test.ext:junit` brings core and monitor
                                  # but NOT the runner, so instrumented tests installed and then died
                                  # with ClassNotFoundException the first time one was ever executed.

[libraries]
# Compose Multiplatform 1.12 deprecated the `compose.ui` and `compose.uiTooling` accessors
# on the plugin's extension — "Specify dependency directly" and "Use
# org.jetbrains.compose.ui:ui-tooling module instead". These are those modules, versioned
# from the same `composeMultiplatform` reference so there is still exactly one Compose
# version in the build. The accessors that were not deprecated (`compose.runtime`,
# `compose.foundation`, `compose.material3`) stay as they are.
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }

# --- Shared / KMP ---
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
sqldelight-driver-jvm = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
lifecycle-viewmodel-compose-mp = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleMp" }
navigation-compose-mp = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationMp" }

# Android app only (STACK.md "Front end", "On-device intelligence")
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
mlkit-image-labeling = { group = "com.google.mlkit", name = "image-labeling", version.ref = "mlkit-imageLabeling" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkit-faceDetection" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit-textRecognition" }

# Compose (STACK.md "Front end")
#
# The androidx Compose artifacts themselves are not listed here: they come from the Compose
# Multiplatform plugin's `compose.*` accessors, in every module including androidApp, so that
# one version governs the whole build. The entries below are the androidx libraries that are
# not part of Compose and carry their own versions.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Encoding pipeline (STACK.md "Encoding pipeline")
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-muxer = { group = "androidx.media3", name = "media3-muxer", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Concurrency
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DI

# Later milestones, coordinates pinned now so the version cannot sit here unverifiable.
# All STACK.md entries; each lands with the milestone named.
telephoto-zoomable-coil3 = { group = "me.saket.telephoto", name = "zoomable-image-coil3", version.ref = "telephoto" }   # m8 viewer
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }                      # m10 progress ring
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
litr = { group = "com.linkedin.android.litr", name = "litr", version.ref = "litr" }                                     # fallback transcoder
simplestorage = { group = "com.anggrayudi", name = "storage", version.ref = "simpleStorage" }                           # m4 SAF move/rename
mp4parser-isoparser = { group = "org.mp4parser", name = "isoparser", version.ref = "isoparser" }                        # m4 MP4 atoms
jimagehash = { group = "dev.brachtendorf", name = "JImageHash", version.ref = "jimagehash" }                            # m9 duplicates
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }                               # m9 face embeddings

# Storage / metadata
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
# m7: HEIC stills through the platform hardware encoder (STACK.md "libheif/HeifWriter").
androidx-heifwriter = { group = "androidx.heifwriter", name = "heifwriter", version.ref = "heifwriter" }

# Benchmark
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No android-library entry: AGP 9 refuses to apply com.android.library alongside
# kotlin.multiplatform, and all 14 library modules in this project are multiplatform,
# so nothing was left to use it. androidApp and benchmark keep the ordinary
# application/test plugins because they are not multiplatform.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
# No kotlin-android entry: AGP 9 has built-in Kotlin support and fails the build if
# `org.jetbrains.kotlin.android` is applied to an Android module. kotlin-multiplatform
# is unaffected — the shared modules are not Android-plugin projects.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
