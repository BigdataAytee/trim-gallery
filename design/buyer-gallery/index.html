<!doctype html>
<!--
  data-theme is set here, before first paint, by the inline script below. Reading
  localStorage in React instead would render one light frame before flipping to dark.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0efe9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)" />
    <title>Photos and clips from buyers</title>
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Light is the default on first load (DESIGN_SPEC.md section 3).
      try {
        var t = localStorage.getItem('buyer-gallery-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {
        /* private mode: fall back to the light default in the markup */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
