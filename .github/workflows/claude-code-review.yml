# Automated review of every pull request against BUILD.md, PROJECT.md and STACK.md.
# Set up per STACK.md, "Anthropic open-source".
#
# This workflow ran for weeks without reviewing anything. First the secret was
# missing, so every run died at credential validation in about twenty seconds.
# Once that was fixed it started passing — and still posted nothing: a planted
# software-encoder fallback (PR #4, closed unmerged) went through 18 turns of
# review and produced a green check with no comment.
#
# The cause was here, not in the model. In agent mode the action runs the prompt
# and nothing publishes the result: `track_progress` was false, so there was no
# comment for the agent to write into, and the prompt never told it to post. The
# findings went to a hidden log, `show_full_output` being false.
#
# So two things below are load-bearing and should not be removed casually:
#   1. track_progress: true — documented as "Force tag mode with tracking
#      comments. Only works with specific PR/issue events." Forcing tag mode is
#      the point, not a side effect: it is what creates the comment the agent
#      writes into. Expect the log to say "Auto-detected mode: tag".
#   2. the "Posting your findings" section of the prompt — an explicit, mandatory
#      instruction to post, including when there is nothing to report. A review
#      that stays silent is indistinguishable from a review that never ran, which
#      is the failure this workflow already had once.
#
# Note for whoever changes this next: the action refuses to run when this file
# differs from the copy on the default branch ("Workflow validation failed ...
# must ... have identical content to the version on the repository's default
# branch"). So a change to this workflow cannot be tested on its own PR — the
# reviewer self-disables there. It can only be validated after it lands on main,
# by opening a PR that does not touch this file.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Creates a PR comment the agent owns and updates. Without it there is
          # nowhere for the review to go.
          track_progress: true
          # TEMPORARY DIAGNOSTIC — remove once the cause below is known.
          #
          # Three consecutive runs (PR #7 twice, PR #8 once) ended with the model
          # never invoked:
          #
          #     "is_error": true, "duration_ms": 573, "num_turns": 1,
          #     "total_cost_usd": 0, "modelUsage": {}
          #
          # ~500 ms, zero cost, empty modelUsage — the API rejected the request
          # before any inference. That envelope is all the log carries, because
          # the action prints "Running Claude Code via SDK (full output hidden
          # for security)" and swallows the rest. Exhausted credit, a spend cap,
          # a revoked key and a rate limit all look identical from outside, and
          # the secret itself is set and non-empty (`ANTHROPIC_API_KEY: ***` in
          # the job env), so the "missing secret" cause is already ruled out.
          #
          # This prints the SDK's own error string. The cost of leaving it on is
          # that every review's full output lands in the job log, which is why it
          # is off by default: take it out again once the reason is in hand.
          show_full_output: true
          prompt: |
            Review this pull request against the project's own specifications, which
            are in the repository: BUILD.md (the spec), PROJECT.md (decisions already
            made and why), STACK.md (the only approved library list) and
            ARCHITECTURE.md (the module layout and the platform adapter matrix).

            Read the project skills in .claude/skills/ and hold the diff to them:
              - codec-priority: hardware encoders only, KEY_PRIORITY=1, reclaim
                handling, no software video encoding anywhere, ever.
              - safe-replace:   originals read-only until one final rename; verify
                before replace; metadata and lastModified preserved.
              - ndk-build:      arm64-v8a only, NEON, submodules not vendored copies.

            Flag in particular:
              - any dependency added that is not listed in STACK.md
              - anything that could put a network permission in the manifest
              - any software video encoding path, or a fallback that could reach one
              - any write to an original file other than the final rename
              - a second ABI creeping into the build
              - a codec created outside CodecFactory, or a library write outside Replacer
              - shared/core/pipeline reaching for a platform type instead of an
                engine-api interface
              - a platform implementation shipped without a fake for the JVM tests
                (ARCHITECTURE.md section 2.7)

            Judge what the code does, not where it sits. The build guards already
            check location — that a codec is only constructed inside a CodecFactory,
            that library writes only happen inside a Replacer. They cannot check
            intent. A software fallback written *inside* MediaCodecFactory passes
            every guard in this repo and still breaks the rule the project cares
            most about. That is exactly the kind of thing you are here for, so read
            what each changed line would do at runtime on a device that lacks the
            hardware the code hopes for.

            ## Posting your findings

            You MUST post a comment on this pull request before you finish, using
            the comment tool available to you — this run has a tracking comment
            created for it, so update that. This is not optional and it is not
            conditional on finding problems:

              - If you found violations, list them. For each one give the file and
                line, the specific rule it breaks (quote the document or skill), and
                what it would do at runtime. Order them worst first.
              - If you found none, say so explicitly — "No violations found against
                BUILD.md, STACK.md, ARCHITECTURE.md or the three skills" — and name
                the things you specifically checked for on this diff.

            Ending without posting is a failed review, however good your analysis
            was. A silent pass is indistinguishable from a job that never ran, and
            this workflow has already spent weeks in exactly that state.
