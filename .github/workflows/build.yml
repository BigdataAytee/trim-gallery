# ARCHITECTURE.md § 16, "Definition of done": compiles for all enabled targets, build
# guards pass, shared tests pass.
name: Build

on:
  push:
  pull_request:

# `head_ref` on a pull_request, `ref` on a push — so the push run and the pull-request
# run for the same branch share a group and one cancels the other. Keyed on `ref` alone
# they are different groups (refs/heads/x versus refs/pull/1/merge) and every commit
# builds twice, which on the macOS runner is the expensive half of the workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every job ends with its failure summary, after the artifact upload, so the diagnosis is
# the last thing in the log rather than several hundred lines of submodule cleanup up from
# the bottom. Gradle failures are mostly stack trace; the interesting lines are the
# compiler errors and the "What went wrong" block.
jobs:
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Runs first and on its own, for two reasons. The guards need no Android SDK and no
      # Google Maven, so a violation is reported in seconds rather than after a full
      # dependency resolution — and, more importantly, `GuardSelfTest` plants a deliberate
      # violation for every rule in every language it claims to police and asserts each one
      # fires. A guard that has never been shown to fire is not a guard, so it is proved
      # here before the step below trusts it.
      - name: Guard self-tests
        id: selftest
        run: |
          set -o pipefail
          ./gradlew -p build-logic test --console=plain 2>&1 | tee /tmp/selftest.log

      - name: Run guards over every module
        id: guards
        run: |
          set -o pipefail
          ./gradlew guards --console=plain 2>&1 | tee /tmp/guards.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-reports
          path: |
            build-logic/build/reports/tests/test
            **/build/reports/guards
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: |
          for log in /tmp/selftest.log /tmp/guards.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            # Deliberately not `^> `: that matches every "> Task :x:y" line Gradle prints,
            # and there are several hundred of them — they filled the summary and pushed the
            # actual failure past `head`.
            grep -E "^e: |FAILURE: |What went wrong|Caused by: |> Task .* FAILED|Analysis failed|VIOLATION" "$log" | head -40 || true
            echo "--- tail ---"
            tail -25 "$log" || true
          done

  shared-tests:
    name: Shared JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The JVM half of ARCHITECTURE.md § 14. iOS targets are only declared on macOS, so
      # this configures and runs on Linux without a Kotlin/Native toolchain.
      - name: Shared unit tests
        run: |
          set -o pipefail
          ./gradlew sharedTest --console=plain 2>&1 | tee /tmp/shared.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-reports
          path: '**/build/reports/tests'
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: |
          echo "=== errors ==="
          grep -E "^e: |FAILURE: |What went wrong|Caused by: |> Task .* FAILED|tests completed" /tmp/shared.log | head -40 || true
          echo "--- tail ---"
          tail -25 /tmp/shared.log || true

  ios-compile:
    name: iOS cross-compile
    runs-on: macos-14
    steps:
      # No submodules. `iosCompile` is Kotlin only — the native metric libraries under
      # shared/native are not built here — and a recursive checkout of libjxl and jpegli
      # pulls a dozen nested repositories, then spends the end of every job cleaning them
      # up. That is minutes of macOS runner time and several hundred lines of log for
      # nothing.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The claim this job exists to test. Until it ran, "the shared layer is portable"
      # rested on a source scan: the code had never been through the Kotlin/Native
      # compiler, which is the only thing that can actually answer the question.
      #
      # The portability guard catches what a grep can see — a `java.util` import in
      # commonMain. It cannot see an expect/actual gap, a dependency published with no
      # Native artifact, or an API that is in the JVM standard library and not in
      # kotlin-stdlib-common. This can.
      - name: Compile every shared module for both iOS targets
        run: |
          set -o pipefail
          ./gradlew iosCompile --console=plain 2>&1 | tee /tmp/ios.log

      # The Swift half, as far as it can honestly go.
      #
      # `xcodebuild build` needs an Xcode project, an app target with a `@main`, and the
      # shared modules published as an XCFramework. None of that exists: ARCHITECTURE.md § 1
      # puts iOS at v1.5, and `iosApp/` is four adapters written to documented behaviour,
      # not an application. Building one is a feature, not hardening.
      #
      # `swiftc -parse` is what is left, and it is not nothing: it is the same check that
      # caught two files in this repository whose entire second half sat inside an unclosed
      # comment. It parses; it does not resolve `import Photos`, so it cannot catch a wrong
      # API. That gap is recorded in PROJECT.md § Device-required verification.
      - name: Parse every Swift source
        if: always()
        run: |
          set -o pipefail
          find iosApp -name '*.swift' -print0 \
            | xargs -0 -n1 -t xcrun swiftc -parse \
                -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
                -target arm64-apple-ios17.0-simulator

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-compile-reports
          path: '**/build/reports'
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: |
          echo "=== errors ==="
          grep -E "^e: |FAILURE: |What went wrong|Caused by: |> Task .* FAILED" /tmp/ios.log | head -40 || true
          echo "--- tail ---"
          tail -25 /tmp/ios.log || true

  android:
    name: Android build + lint
    runs-on: ubuntu-latest
    steps:
      # With submodules: this is the only job that runs CMake, and
      # `shared/native/CMakeLists.txt` builds xpsnr, vmaf, libjxl and jpegli from source.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: |
          set -o pipefail
          ./gradlew detekt ktlintCheck --console=plain 2>&1 | tee /tmp/lint.log

      # Split from the assemble below on purpose. This step is the first and only place
      # Compose Multiplatform is compiled — the environment the code is written in cannot
      # resolve androidx from Google Maven at all — and a Compose error should not be
      # reported as a failure of a CMake build of libjxl.
      - name: Compile Kotlin for Android
        run: |
          set -o pipefail
          ./gradlew :androidApp:compileDebugKotlin --console=plain 2>&1 | tee /tmp/compile.log

      # assembleDebug depends on the merged-manifest guard, so a network permission
      # arriving through a dependency fails here even if no source changed. It also runs
      # the native build, which is why this job checks out submodules.
      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --console=plain 2>&1 | tee /tmp/assemble.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: |
          for log in /tmp/lint.log /tmp/compile.log /tmp/assemble.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            grep -E "^e: |FAILURE: |What went wrong|Caused by: |> Task .* FAILED|Analysis failed|Lint error" "$log" | head -40 || true
            echo "--- tail ---"
            tail -25 "$log" || true
          done
