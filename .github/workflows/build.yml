# ARCHITECTURE.md § 16, "Definition of done": compiles for all enabled targets, build
# guards pass, shared tests pass.
name: Build

on:
  push:
  pull_request:

# `head_ref` on a pull_request, `ref_name` on a push — both are the bare branch name, so
# the push run and the pull-request run for the same commit share a group and one cancels
# the other. `ref` is the wrong second half and was the first attempt: on a push it is
# `refs/heads/x` while the pull request's `head_ref` is `x`, which are different groups, so
# every commit built twice — and the macOS runner is the expensive half of this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Every job ends with a failure summary that both prints the diagnosis and emits it as
# GitHub error annotations. Gradle failures are mostly stack trace; the interesting lines
# are the compiler errors and the "What went wrong" block, and a job that checks out
# submodules buries its own log tail under two hundred lines of post-job cleanup, which an
# annotation survives.
jobs:
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Runs first and on its own, for two reasons. The guards need no Android SDK and no
      # Google Maven, so a violation is reported in seconds rather than after a full
      # dependency resolution — and, more importantly, `GuardSelfTest` plants a deliberate
      # violation for every rule in every language it claims to police and asserts each one
      # fires. A guard that has never been shown to fire is not a guard, so it is proved
      # here before the step below trusts it.
      - name: Guard self-tests
        run: |
          set -o pipefail
          ./gradlew -p build-logic test --console=plain 2>&1 | tee /tmp/selftest.log

      - name: Run guards over every module
        run: |
          set -o pipefail
          ./gradlew guards --console=plain 2>&1 | tee /tmp/guards.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-reports
          path: |
            build-logic/build/reports/tests/test
            **/build/reports/guards
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: bash .github/failure-summary.sh /tmp/selftest.log /tmp/guards.log

  shared-tests:
    name: Shared JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The JVM half of ARCHITECTURE.md § 14. iOS targets are only declared on macOS, so
      # this configures and runs on Linux without a Kotlin/Native toolchain.
      - name: Shared unit tests
        run: |
          set -o pipefail
          ./gradlew sharedTest --console=plain 2>&1 | tee /tmp/shared.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-reports
          path: '**/build/reports/tests'
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: bash .github/failure-summary.sh /tmp/shared.log

  ios-compile:
    name: iOS cross-compile
    runs-on: macos-14
    steps:
      # No submodules. `iosCompile` is Kotlin only — the native metric libraries under
      # shared/native are not built here.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The claim this job exists to test. Until it ran, "the shared layer is portable"
      # rested on a source scan: the code had never been through the Kotlin/Native
      # compiler, which is the only thing that can actually answer the question.
      #
      # The portability guard catches what a grep can see — a `java.util` import in
      # commonMain. It cannot see an expect/actual gap, a dependency published with no
      # Native artifact, or an API that is in the JVM standard library and not in
      # kotlin-stdlib-common. This can.
      - name: Compile every shared module for both iOS targets
        run: |
          set -o pipefail
          ./gradlew iosCompile --console=plain 2>&1 | tee /tmp/ios.log

      # The Swift half, as far as it can honestly go.
      #
      # `xcodebuild build` needs an Xcode project, an app target with a `@main`, and the
      # shared modules published as an XCFramework. None of that exists: ARCHITECTURE.md § 1
      # puts iOS at v1.5, and `iosApp/` is four adapters written to documented behaviour,
      # not an application. Building one is a feature, not hardening.
      #
      # `swiftc -parse` is what is left, and it is not nothing: it is the same check that
      # caught two files in this repository whose entire second half sat inside an unclosed
      # comment. It parses; it does not resolve `import Photos`, so it cannot catch a wrong
      # API. That gap is recorded in PROJECT.md § Device-required verification.
      - name: Parse every Swift source
        if: always()
        run: |
          set -o pipefail
          find iosApp -name '*.swift' -print0 \
            | xargs -0 -n1 -t xcrun swiftc -parse \
                -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
                -target arm64-apple-ios17.0-simulator

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-compile-reports
          path: '**/build/reports'
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: bash .github/failure-summary.sh /tmp/ios.log

  android:
    name: Android build + lint
    runs-on: ubuntu-latest
    steps:
      # No submodules: nothing in this job runs CMake, and a recursive checkout of libjxl
      # and jpegli pulls a dozen nested repositories, then spends two hundred lines of the
      # post-job step cleaning them up — two hundred lines between this job's failure
      # summary and the end of its log. The native build lives in `apk` below.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: |
          set -o pipefail
          ./gradlew detekt ktlintCheck --console=plain 2>&1 | tee /tmp/lint.log

      # The first and only place Compose Multiplatform is compiled: the environment this
      # code is written in cannot resolve androidx from Google Maven at all. Split from the
      # assemble so a Compose error is not reported as a failure of a CMake build of libjxl.
      - name: Compile Kotlin for Android
        run: |
          set -o pipefail
          ./gradlew :androidApp:compileDebugKotlin --console=plain 2>&1 | tee /tmp/compile.log

      - name: Failure summary
        if: failure()
        run: bash .github/failure-summary.sh /tmp/lint.log /tmp/compile.log

  apk:
    name: Android APK + native
    runs-on: ubuntu-latest
    steps:
      # The one job that needs submodules: `shared/native/CMakeLists.txt` builds xpsnr,
      # vmaf, libjxl and jpegli from source, and `assembleDebug` runs it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # `shared/native/CMakeLists.txt` drives three build systems it does not own, and
      # `find_program(... REQUIRED)` fails configuration when any of them is missing:
      #
      #   meson + ninja  libvmaf builds with meson; CMake shells out to it through a
      #                  generated cross file. The Android SDK ships a private ninja
      #                  beside its CMake, but not on PATH, which is where find_program
      #                  looks — so both come from pip, pinned to nothing because they
      #                  are build tools, not shipped code.
      #   cargo          oxipng is Rust. The runner image has the toolchain; what it does
      #                  not have is the Android target, and cross-compiling to arm64
      #                  without it fails after the C libraries have already built.
      #
      # Not a workaround for a broken CMake file: these are its documented prerequisites,
      # and the first CI run of `assembleDebug` is the first time anything has had to
      # satisfy them.
      - name: Native build prerequisites
        run: |
          set -o pipefail
          python3 -m pip install --upgrade meson ninja
          rustup target add aarch64-linux-android
          # `cargo ndk`, not plain `cargo`: the CMake invokes the cargo-ndk subcommand,
          # which sets the linker and the sysroot for the Android target. Without it cargo
          # answers "no such command: ndk" after the C libraries have already built.
          cargo install cargo-ndk --locked
          meson --version
          ninja --version
          cargo --version
          cargo ndk --version

      # assembleDebug depends on the merged-manifest guard, so a network permission
      # arriving through a dependency fails here even if no source changed.
      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --console=plain 2>&1 | tee /tmp/assemble.log

      # An APK that builds and is missing a library it loads is a crash on first use, not a
      # build failure — so the packaged `.so` set is asserted rather than assumed.
      # `libtrim_native.so` links libjxl, libjxl_cms and the three brotli libraries as
      # shared objects, and every one of them has to be in the APK for System.loadLibrary
      # to succeed on a device.
      - name: The APK carries every library it loads
        run: |
          set -o pipefail
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*\.so' || true
          missing=0
          for lib in libtrim_native.so libjxl.so libjxl_cms.so \
                     libbrotlidec.so libbrotlienc.so libbrotlicommon.so; do
            if unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib"; then
              echo "  ok      $lib"
            else
              echo "::error::$lib is linked into libtrim_native.so but is not in the APK"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: bash .github/failure-summary.sh /tmp/assemble.log
