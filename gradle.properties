org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# arm64-v8a is the only ABI this project ships (STACK.md "Native build layout").
# Keeping it here as well as in the app module means a stray `abiFilters` in a
# library module cannot quietly reintroduce another ABI.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false

kotlin.code.style=official
